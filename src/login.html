<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login · lansight</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --red: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input[type=password]:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 11px;
    background: var(--accent);
    color: #06101f;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .error {
    display: none;
    margin: 0 0 14px;
    padding: 9px 11px;
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid rgba(248, 81, 73, 0.4);
    border-radius: 9px;
    color: var(--red);
    font-size: 13px;
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>lansight</h1>
    <p class="sub">Masukkan password untuk lihat dashboard.</p>
    <div class="error" id="err">Password salah. Coba lagi.</div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Masuk</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('e') === '1') {
      document.getElementById('err').style.display = 'block';
    }
  </script>
</body>
</html>

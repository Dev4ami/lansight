<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>NetScanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="lansight">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --bg-elev-2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    padding: calc(var(--safe-top) + 8px) 0 calc(var(--safe-bot) + 80px);
    min-height: 100vh;
  }

  /* ===== Sticky header ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13, 17, 23, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    margin: -8px 0 12px;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 18px;
    margin: 0;
    color: var(--accent);
    font-weight: 700;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
  }
  .dot.scanning { background: var(--orange); animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .meta-grid .label { color: var(--muted); }
  .meta-grid .value { color: var(--text); font-weight: 500; }

  /* ===== Toolbar ===== */
  .toolbar {
    padding: 0 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--accent); }
  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
    font-weight: 500;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip:active { transform: scale(0.96); }

  /* ===== Device list ===== */
  .device-list {
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    transition: transform 0.1s, border-color 0.15s;
  }
  .card:active { transform: scale(0.99); }
  .card.has-mac { border-left: 3px solid var(--green); }
  .card.random-mac { border-left: 3px solid var(--red); }
  .card.is-new { border-left: 4px solid var(--orange); }
  .card.offline {
    opacity: 0.55;
    border-style: dashed;
  }
  .card.offline .ip { color: var(--muted); }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }
  .head-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .ip {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: -0.3px;
  }
  .dev-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    cursor: text;
    padding: 1px 4px;
    margin: -1px -4px;
    border-radius: 4px;
    transition: background 0.1s;
  }
  .dev-label:hover { background: var(--bg-elev-2); }
  .dev-label-placeholder {
    color: var(--muted);
    font-weight: 500;
    font-style: italic;
    font-size: 13px;
  }
  .dev-label.editing {
    background: var(--bg-elev-2);
    outline: 1px solid var(--accent);
  }
  .head-badges {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-end;
  }
  .badge-new {
    background: var(--orange);
    color: #1c1300;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .badge-offline {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 600;
  }
  .vendor {
    display: inline-block;
    background: #1c2b4a;
    border: 1px solid #2f5191;
    color: #79b8ff;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .vendor.random {
    background: #3a1c1c;
    border-color: #913a3a;
    color: #ffa9a9;
  }
  .badge-os {
    display: inline-block;
    background: #1c3a2b;
    border: 1px solid #2f7a52;
    color: #7fe0a8;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }

  .field {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin: 4px 0;
    font-size: 13px;
  }
  .field-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex: 0 0 70px;
    font-weight: 600;
  }
  .field-value {
    color: var(--text);
    flex: 1;
    word-break: break-all;
  }
  .field-value.mono {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .field-value.title { color: var(--purple); font-weight: 500; }
  .field-value.empty { color: var(--muted); font-style: italic; }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .port {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    font-weight: 500;
  }
  .src {
    background: #1f3a2e;
    border: 1px solid #2ea043;
    color: #56d364;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 500;
  }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }

  /* ===== Empty state ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  .empty-state .msg { font-size: 14px; }

  /* ===== FAB & footer ===== */
  .fab {
    position: fixed;
    bottom: calc(var(--safe-bot) + 20px);
    right: 20px;
    z-index: 20;
    background: var(--accent);
    color: #fff;
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    box-shadow: 0 4px 16px rgba(88, 166, 255, 0.4);
    cursor: pointer;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.92); }
  .fab.refreshing svg { animation: spin 1s linear infinite; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ===== Detail modal ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-content {
    position: relative;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 20px 16px calc(var(--safe-bot) + 24px);
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-section { margin-top: 16px; }
  .modal-section h3 {
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .modal-title {
    margin: 0;
    font-size: 20px;
    color: var(--text);
    font-weight: 700;
  }
  .modal-mac {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .modal-notes {
    width: 100%;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    min-height: 70px;
    resize: vertical;
    outline: none;
  }
  .modal-notes:focus { border-color: var(--accent); }
  .modal-label-input {
    width: 100%;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    outline: none;
  }
  .modal-label-input:focus { border-color: var(--accent); }
  .rtt {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .rtt-good { color: #4ade80; border-color: #4ade8055; background: #4ade8011; }
  .rtt-ok   { color: #fbbf24; border-color: #fbbf2455; background: #fbbf2411; }
  .rtt-slow { color: #f87171; border-color: #f8717155; background: #f8717111; }
  .dev-type {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .btn {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.ghost {
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .timeline {
    display: flex;
    background: var(--bg-elev-2);
    border-radius: 4px;
    overflow: hidden;
    height: 28px;
    border: 1px solid var(--border);
  }
  .timeline-block { height: 100%; }
  .timeline-block.online { background: var(--green); }
  .timeline-block.offline { background: transparent; }
  .timeline-axis {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
  }
  @media (min-width: 768px) {
    .modal-overlay { align-items: center; padding: 20px; }
    .modal-content {
      border-radius: 16px;
      border: 1px solid var(--border);
    }
  }

  /* ===== Desktop refinements ===== */
  @media (min-width: 768px) {
    body { padding-left: 16px; padding-right: 16px; }
    header { margin-left: -16px; margin-right: -16px; padding-left: 24px; padding-right: 24px; }
    .toolbar { padding-left: 0; padding-right: 0; }
    .device-list {
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    }
    h1 { font-size: 22px; }
    .meta-grid {
      grid-template-columns: repeat(4, auto);
      gap: 6px 24px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="title-row">
      <h1>
        <img src="/favicon.svg" alt="" width="22" height="22" style="vertical-align:-4px;margin-right:4px;border-radius:4px">
        lansight
      </h1>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="status-pill">
          <span class="dot" id="status-dot"></span>
          <span id="status">idle</span>
        </span>
        <form method="POST" action="/logout" style="margin:0">
          <button type="submit" title="Keluar"
            style="background:var(--bg-elev-2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer">Keluar</button>
        </form>
      </div>
    </div>
    <div class="meta-grid">
      <div><span class="label">Local IP:</span> <span class="value" id="local-ip">-</span></div>
      <div><span class="label">Subnet:</span> <span class="value" id="subnet">-</span></div>
      <div><span class="label">Last scan:</span> <span class="value" id="last-scan">-</span></div>
      <div><span class="label">Devices:</span> <span class="value" id="count">0</span></div>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" class="search" id="search" placeholder="🔍 Cari IP, MAC, vendor, hostname…" autocomplete="off">
    <div class="chips" id="filters">
      <span class="chip active" data-filter="all">Semua</span>
      <span class="chip" data-filter="online">Online</span>
      <span class="chip" data-filter="new">BARU</span>
      <span class="chip" data-filter="offline">Offline</span>
      <span class="chip" data-filter="labeled">Bernama</span>
      <span class="chip" data-filter="mac">Punya MAC</span>
      <span class="chip" data-filter="ports">Port terbuka</span>
      <span class="chip" data-filter="title">Web service</span>
    </div>
  </div>

  <div class="device-list" id="devices">
    <div class="empty-state">
      <div class="icon">📡</div>
      <div class="msg">Menunggu scan pertama…<br><small>biasanya ~20 detik</small></div>
    </div>
  </div>

  <div id="detail-modal" class="modal-overlay" hidden>
    <div class="modal-content" id="modal-body"></div>
  </div>

  <button class="fab" id="refresh-btn" aria-label="Refresh">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Session expired / not logged in — bounce to the login page.
function gateLogin(res) {
  if (res.status === 401) { location.href = '/login'; return true; }
  return false;
}

const sourceLabel = src => {
  if (src.startsWith('tcp:')) return src;
  if (src === 'tcp-rst') return 'tcp-rst';
  if (src === 'icmp') return 'ICMP';
  if (src === 'mdns') return 'mDNS';
  if (src === 'ssdp') return 'SSDP';
  if (src === 'netbios') return 'NetBIOS';
  return src;
};

let currentFilter = 'all';
let lastDevices = [];
let lastQuery = '';
let editingLabel = false;

function passFilter(d) {
  if (currentFilter === 'mac') return !!d.mac;
  if (currentFilter === 'vendor') return d.vendor && d.vendor !== 'Randomized MAC';
  if (currentFilter === 'ports') return (d.open_ports || []).length > 0;
  if (currentFilter === 'title') return !!d.title;
  if (currentFilter === 'new') return !!d.is_new;
  if (currentFilter === 'online') return d.online !== false;
  if (currentFilter === 'offline') return d.online === false;
  if (currentFilter === 'labeled') return !!d.label;
  return true;
}

function passSearch(d, q) {
  if (!q) return true;
  const hay = [d.ip, d.mac, d.vendor, d.hostname, d.title, d.label, guessDevice(d).label]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

// Best-effort device-type guess from open ports + vendor + discovery sources.
// Heuristic only; first matching rule wins, most-specific first.
function guessDevice(d) {
  const ports = new Set(d.open_ports || []);
  const has = p => ports.has(p);
  const vendor = (d.vendor || '').toLowerCase();
  const sources = (d.sources || []).join(' ').toLowerCase();
  const text = [d.hostname, d.title].filter(Boolean).join(' ').toLowerCase();
  const ipLast = parseInt(String(d.ip || '').split('.').pop(), 10);
  const v = (...names) => names.some(n => vendor.includes(n));
  const t = (...kw) => kw.some(k => text.includes(k));

  if (v('vmware', 'virtualbox', 'docker', 'parallels', 'xen'))
    return { icon: '🖥️', label: 'VM / Container' };
  if (has(9100) || has(631) || has(515) || t('printer', 'jetdirect'))
    return { icon: '🖨️', label: 'Printer' };
  if (has(554) || v('hikvision', 'dahua', 'reolink', 'axis') || t('ipcam', 'camera'))
    return { icon: '📷', label: 'Kamera' };
  if (has(32400) || has(8008) || has(8009) || has(7000) || has(8060)
      || t('chromecast', 'roku', 'plex', 'airplay', 'dlna', 'mediarenderer', 'smart tv', 'bravia', 'appletv'))
    return { icon: '📺', label: 'TV / Media' };
  if ((has(5000) && v('synology')) || has(5001) || v('qnap', 'synology', 'western digital')
      || t('synology', 'qnap', 'dsm', ' nas'))
    return { icon: '🗄️', label: 'NAS' };
  if (has(1883) || v('tuya', 'espressif', 'sonoff', 'shelly', 'tasmota', 'sengled')
      || t('tuya', 'shelly', 'sonoff', 'smartlife', 'esphome'))
    return { icon: '💡', label: 'Smart home' };
  if ((v('tp-link', 'tplink', 'mikrotik', 'ubiquiti', 'asustek', 'netgear', 'd-link', 'huawei', 'zte', 'tenda', 'cisco', 'fortinet')
        && (has(53) || has(80) || has(443) || sources.includes('ssdp')))
      || t('router', 'gateway', 'miniupnpd', 'routeros', 'openwrt', 'dd-wrt', 'pfsense')
      || ((ipLast === 1 || ipLast === 254) && (has(53) || has(80))))
    return { icon: '🌐', label: 'Router' };
  if (v('sony', 'nintendo') || t('playstation', 'xbox', 'nintendo'))
    return { icon: '🎮', label: 'Konsol game' };
  if (has(445) || has(139) || has(3389) || sources.includes('netbios')
      || v('dell', 'lenovo', 'microsoft', 'gigabyte', 'msi', 'intel'))
    return { icon: '💻', label: 'Komputer' };
  if (v('raspberry')) return { icon: '🍓', label: 'Raspberry Pi' };
  if (has(22) || has(3306)) return { icon: '🖥️', label: 'Server / Linux' };
  if (d.vendor === 'Randomized MAC'
      || v('samsung', 'xiaomi', 'oppo', 'vivo', 'oneplus', 'realme', 'motorola', 'redmi', 'honor'))
    return { icon: '📱', label: 'HP / Mobile' };
  if (v('apple')) return { icon: '🍎', label: 'Apple' };
  return { icon: '❓', label: '' };
}

function rttBadge(d) {
  if (d.rtt_ms == null) return '';
  const ms = d.rtt_ms;
  const cls = ms < 30 ? 'rtt-good' : ms < 100 ? 'rtt-ok' : 'rtt-slow';
  return `<span class="rtt ${cls}" title="latensi TCP (waktu connect)">${ms} ms</span>`;
}

const OS_ICONS = {
  'Windows': '🪟', 'Linux/Unix': '🐧', 'Apple': '🍎',
  'Android': '📱', 'Router/IoT': '🔌', 'Embedded': '⚙️',
};
function osBadge(d) {
  if (!d.os_guess) return '';
  const icon = OS_ICONS[d.os_guess] || '💻';
  const tip = d.ttl != null
    ? `Tebakan OS dari TTL ${d.ttl} + pola port`
    : 'Tebakan OS dari pola port';
  return `<span class="badge-os" title="${tip}">${icon} ${esc(d.os_guess)}</span>`;
}

function renderCard(d) {
  const dev = guessDevice(d);
  const classes = [];
  if (d.vendor === 'Randomized MAC') classes.push('random-mac');
  else if (d.mac) classes.push('has-mac');
  if (d.is_new) classes.push('is-new');
  if (d.online === false) classes.push('offline');

  const vendorBadge = d.vendor
    ? `<span class="vendor ${d.vendor === 'Randomized MAC' ? 'random' : ''}">${esc(d.vendor)}</span>`
    : '';

  const badges = [];
  if (d.is_new) badges.push('<span class="badge-new">BARU</span>');
  if (d.online === false) badges.push('<span class="badge-offline">offline</span>');

  const ports = (d.open_ports || []).map(p =>
    `<span class="port">${p}</span>`).join('');
  const sources = (d.sources || []).map(s =>
    `<span class="src">${esc(sourceLabel(s))}</span>`).join('');

  const row = (label, value, valClass = '') => {
    if (!value) return `<div class="field"><span class="field-label">${label}</span><span class="field-value empty">-</span></div>`;
    return `<div class="field"><span class="field-label">${label}</span><span class="field-value ${valClass}">${esc(value)}</span></div>`;
  };

  const labelEl = d.mac
    ? (d.label
        ? `<div class="dev-label" data-mac="${esc(d.mac)}" title="klik untuk ubah nama">${esc(d.label)}</div>`
        : `<div class="dev-label" data-mac="${esc(d.mac)}" title="klik untuk kasih nama"><span class="dev-label-placeholder">+ kasih nama</span></div>`)
    : '';

  const seenLabel = d.times_seen ? ` · ${d.times_seen}× terlihat` : '';

  const macAttr = d.mac ? ` data-mac="${esc(d.mac)}"` : '';
  return `
    <div class="card ${classes.join(' ')}"${macAttr}>
      <div class="card-head">
        <div class="head-main">
          ${labelEl}
          <div class="ip">${esc(d.ip)}</div>
          ${dev.label ? `<div class="dev-type">${dev.icon} ${esc(dev.label)}</div>` : ''}
        </div>
        <div class="head-badges">
          ${badges.join('')}
          ${osBadge(d)}
          ${rttBadge(d)}
          ${vendorBadge}
        </div>
      </div>
      ${row('MAC', d.mac, 'mono')}
      ${row('Host', d.hostname)}
      ${row('Title', d.title, 'title')}
      ${ports ? `<div class="tags">${ports}</div>` : ''}
      <div class="card-foot">
        <div class="tags" style="margin: 0">${sources}</div>
        <span>⏱ ${esc(d.last_seen)}${seenLabel}</span>
      </div>
    </div>
  `;
}

async function saveLabel(mac, label) {
  try {
    const res = await fetch('/api/label', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mac, label: label || null }),
    });
    if (gateLogin(res)) return;
    if (!res.ok) throw new Error('save failed');
    const d = lastDevices.find(x => x.mac && x.mac.toLowerCase() === mac.toLowerCase());
    if (d) d.label = label || null;
    renderAll();
  } catch (e) {
    alert('Gagal menyimpan label: ' + e.message);
  }
}

function startLabelEdit(el) {
  if (el.classList.contains('editing')) return;
  const mac = el.dataset.mac;
  const current = el.querySelector('.dev-label-placeholder') ? '' : el.textContent.trim();
  el.classList.add('editing');
  editingLabel = true;
  el.innerHTML = `<input class="label-input" style="background:transparent;border:none;color:inherit;font:inherit;width:100%;outline:none" value="${esc(current)}" maxlength="40" placeholder="HP Ayah, Printer Dapur…">`;
  const input = el.querySelector('input');
  input.focus();
  input.select();
  const commit = (save) => {
    el.classList.remove('editing');
    editingLabel = false;
    if (save) {
      const v = input.value.trim();
      saveLabel(mac, v);
    } else {
      renderAll();
    }
  };
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  });
}

function renderAll() {
  if (editingLabel) return; // keep an open inline label input from being wiped by refresh
  const q = lastQuery.trim().toLowerCase();
  const list = lastDevices.filter(d => passFilter(d) && passSearch(d, q));
  const container = document.getElementById('devices');
  document.getElementById('count').textContent = list.length;

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">${lastDevices.length === 0 ? '📡' : '🔍'}</div>
        <div class="msg">${lastDevices.length === 0
          ? 'Belum ada device terdeteksi.'
          : 'Tidak ada hasil sesuai filter.'}</div>
      </div>`;
    return;
  }
  container.innerHTML = list.map(renderCard).join('');
}

async function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('refreshing');
  try {
    const res = await fetch('/api/devices');
    if (gateLogin(res)) return;
    const data = await res.json();

    document.getElementById('local-ip').textContent = data.local_ip;
    document.getElementById('subnet').textContent = data.subnet;
    document.getElementById('last-scan').textContent = data.last_scan;

    const dot = document.getElementById('status-dot');
    const status = document.getElementById('status');
    if (data.scanning) {
      dot.classList.add('scanning');
      status.textContent = 'scanning';
    } else {
      dot.classList.remove('scanning');
      status.textContent = 'idle';
    }

    lastDevices = data.devices || [];
    renderAll();
  } catch (e) {
    console.error('Refresh failed', e);
  } finally {
    setTimeout(() => btn.classList.remove('refreshing'), 400);
  }
}

document.getElementById('search').addEventListener('input', (e) => {
  lastQuery = e.target.value;
  renderAll();
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderAll();
  });
});

document.getElementById('refresh-btn').addEventListener('click', refresh);

function formatTs(ts) {
  if (!ts) return '-';
  return new Date(ts * 1000).toLocaleString('id-ID', {
    dateStyle: 'medium', timeStyle: 'short'
  });
}
function formatAgo(s) {
  if (s < 0) s = 0;
  if (s < 60) return s + 's lalu';
  if (s < 3600) return Math.floor(s/60) + 'm lalu';
  if (s < 86400) return Math.floor(s/3600) + 'j lalu';
  return Math.floor(s/86400) + 'h lalu';
}

function renderTimeline(events, now) {
  const windowSec = 24 * 3600;
  const start = now - windowSec;
  events = events || [];
  let state = false;
  for (const e of events) { if (e.ts < start) state = e.online; else break; }
  const segments = [];
  let cursor = start;
  for (const e of events) {
    if (e.ts < start) continue;
    if (e.ts > now) break;
    if (e.ts > cursor) segments.push({ start: cursor, end: e.ts, on: state });
    state = e.online;
    cursor = e.ts;
  }
  if (cursor < now) segments.push({ start: cursor, end: now, on: state });
  if (!segments.length) {
    return '<div style="color:var(--muted);font-size:12px">Belum ada data presence (perlu beberapa jam scan).</div>';
  }
  const blocks = segments.map(s => {
    const w = ((s.end - s.start) / windowSec * 100).toFixed(3);
    const tip = `${new Date(s.start*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} → ${new Date(s.end*1000).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}: ${s.on?'online':'offline'}`;
    return `<div class="timeline-block ${s.on?'online':'offline'}" style="width:${w}%" title="${esc(tip)}"></div>`;
  }).join('');
  return `<div class="timeline">${blocks}</div>
          <div class="timeline-axis"><span>-24j</span><span>-12j</span><span>sekarang</span></div>`;
}

function renderDetail(data) {
  const r = data.record;
  const c = data.current;
  const now = data.now;
  const online = c && c.online;
  const title = r.label || r.hostname || r.ip || data.mac;
  const dev = guessDevice(c || { vendor: r.vendor, ip: r.ip, hostname: r.hostname, open_ports: [], sources: [] });

  return `
    <button class="modal-close" id="modal-close" aria-label="Tutup">×</button>
    <div class="modal-section">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 class="modal-title">${esc(title)}</h2>
        ${online ? '<span class="src">online</span>' : '<span class="badge-offline">offline</span>'}
        ${c && c.is_new ? '<span class="badge-new">BARU</span>' : ''}
        ${dev.label ? `<span class="src">${dev.icon} ${esc(dev.label)}</span>` : ''}
      </div>
      <div class="modal-mac">${esc(data.mac)}</div>
    </div>

    ${r.vendor ? `<div class="modal-section">
      <h3>Vendor</h3>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="vendor ${r.vendor === 'Randomized MAC' ? 'random' : ''}">${esc(r.vendor)}</span>
        ${data.same_vendor_count > 1 ? `<button class="chip" id="filter-vendor-btn" data-vendor="${esc(r.vendor)}">filter ${data.same_vendor_count} device dari vendor ini</button>` : ''}
      </div>
    </div>` : ''}

    <div class="modal-section">
      <h3>Info</h3>
      <div class="field"><span class="field-label">IP</span><span class="field-value mono">${esc(r.ip || '-')}</span></div>
      <div class="field"><span class="field-label">Hostname</span><span class="field-value">${esc(r.hostname || '-')}</span></div>
      ${(() => { const os = (c && c.os_guess) || r.os_guess; return os ? `<div class="field"><span class="field-label">OS (tebakan)</span><span class="field-value">${OS_ICONS[os] || '💻'} ${esc(os)}${c && c.ttl != null ? ` <span style="color:var(--muted)">(TTL ${c.ttl})</span>` : ''}</span></div>` : ''; })()}
      ${c && c.rtt_ms != null ? `<div class="field"><span class="field-label">Latensi</span><span class="field-value">${c.rtt_ms} ms <span style="color:var(--muted)">(${c.ttl != null ? 'ICMP' : 'TCP'})</span></span></div>` : ''}
      ${c && c.title ? `<div class="field"><span class="field-label">Title</span><span class="field-value title">${esc(c.title)}</span></div>` : ''}
    </div>

    <div class="modal-section">
      <h3>Statistik</h3>
      <div class="field"><span class="field-label">Pertama</span><span class="field-value">${esc(formatTs(r.first_seen))}</span></div>
      <div class="field"><span class="field-label">Terakhir</span><span class="field-value">${esc(formatTs(r.last_seen))} <span style="color:var(--muted)">(${esc(formatAgo(now - r.last_seen))})</span></span></div>
      <div class="field"><span class="field-label">Scan</span><span class="field-value">${r.times_seen}× terdeteksi</span></div>
    </div>

    <div class="modal-section">
      <h3>Timeline 24 jam terakhir</h3>
      ${renderTimeline(r.presence_events, now)}
    </div>

    ${c && c.open_ports && c.open_ports.length ? `<div class="modal-section">
      <h3>Port terbuka</h3>
      <div class="tags">${c.open_ports.map(p => `<span class="port">${p}</span>`).join('')}</div>
    </div>` : ''}

    ${c && c.sources && c.sources.length ? `<div class="modal-section">
      <h3>Sumber deteksi</h3>
      <div class="tags">${c.sources.map(s => `<span class="src">${esc(sourceLabel(s))}</span>`).join('')}</div>
    </div>` : ''}

    <div class="modal-section">
      <h3>Nama</h3>
      <input class="modal-label-input" id="modal-label" placeholder="HP Ayah, Printer Dapur…" maxlength="40" value="${esc(r.label || '')}">
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn" id="save-label-btn">Simpan nama</button>
      </div>
    </div>

    <div class="modal-section">
      <h3>Catatan</h3>
      <textarea class="modal-notes" id="modal-notes" placeholder="Catatan bebas: lokasi, pemilik, kapan dibeli…" maxlength="500">${esc(r.notes || '')}</textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn" id="save-notes-btn">Simpan catatan</button>
      </div>
    </div>
  `;
}

async function showDetail(mac) {
  const modal = document.getElementById('detail-modal');
  const body = document.getElementById('modal-body');
  modal.hidden = false;
  body.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">memuat…</div>';
  try {
    const res = await fetch('/api/device/' + encodeURIComponent(mac));
    if (gateLogin(res)) return;
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    body.innerHTML = renderDetail(data);
    wireDetail(body, data);
  } catch (e) {
    body.innerHTML = `<button class="modal-close" id="modal-close">×</button>
                      <div style="padding:60px 20px;text-align:center;color:var(--muted)">
                        Device <code>${esc(mac)}</code> belum punya riwayat.<br>
                        <small>Akan muncul setelah scan berikutnya.</small>
                      </div>`;
    body.querySelector('#modal-close').addEventListener('click', closeDetail);
  }
}

function closeDetail() {
  document.getElementById('detail-modal').hidden = true;
  if (location.hash.startsWith('#device/')) {
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function wireDetail(body, data) {
  body.querySelector('#modal-close')?.addEventListener('click', closeDetail);
  body.querySelector('#filter-vendor-btn')?.addEventListener('click', (e) => {
    const v = e.currentTarget.dataset.vendor;
    const input = document.getElementById('search');
    input.value = v;
    lastQuery = v;
    closeDetail();
    renderAll();
  });
  body.querySelector('#modal-label')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); body.querySelector('#save-label-btn')?.click(); }
  });
  body.querySelector('#save-label-btn')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const val = body.querySelector('#modal-label').value.trim();
    btn.disabled = true;
    btn.textContent = 'menyimpan…';
    try {
      const res = await fetch('/api/label', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mac: data.mac, label: val || null })
      });
      if (gateLogin(res)) return;
      if (!res.ok) throw new Error('save failed');
      const d = lastDevices.find(x => x.mac && x.mac.toLowerCase() === data.mac.toLowerCase());
      if (d) d.label = val || null;
      const titleEl = body.querySelector('.modal-title');
      if (titleEl) titleEl.textContent = val || data.record.hostname || data.record.ip || data.mac;
      renderAll();
      btn.textContent = 'Tersimpan ✓';
    } catch (err) {
      btn.textContent = 'Gagal — coba lagi';
    }
    setTimeout(() => { btn.textContent = 'Simpan nama'; btn.disabled = false; }, 1400);
  });
  body.querySelector('#save-notes-btn')?.addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const text = body.querySelector('#modal-notes').value.trim();
    btn.disabled = true;
    btn.textContent = 'menyimpan…';
    try {
      const res = await fetch('/api/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mac: data.mac, notes: text || null })
      });
      if (gateLogin(res)) return;
      if (!res.ok) throw new Error('save failed');
      const d = lastDevices.find(x => x.mac && x.mac.toLowerCase() === data.mac.toLowerCase());
      if (d) d.notes = text || null;
      btn.textContent = 'Tersimpan ✓';
    } catch (err) {
      btn.textContent = 'Gagal — coba lagi';
    }
    setTimeout(() => { btn.textContent = 'Simpan catatan'; btn.disabled = false; }, 1400);
  });
}

document.getElementById('detail-modal').addEventListener('click', (e) => {
  if (e.target.id === 'detail-modal') closeDetail();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('detail-modal').hidden) closeDetail();
});

function handleHash() {
  const m = location.hash.match(/^#device\/(.+)$/);
  if (m) showDetail(decodeURIComponent(m[1]));
  else closeDetail();
}
window.addEventListener('hashchange', handleHash);

document.getElementById('devices').addEventListener('click', (e) => {
  const labelEl = e.target.closest('.dev-label');
  if (labelEl) { startLabelEdit(labelEl); return; }
  const card = e.target.closest('.card[data-mac]');
  if (card) {
    const mac = card.dataset.mac;
    location.hash = '#device/' + encodeURIComponent(mac);
  }
});

refresh();
setInterval(refresh, 5000);
handleHash();
</script>
</body>
</html>

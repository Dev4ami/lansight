<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1c2b4a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#79b8ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Radar rings -->
    <circle r="180" fill="none" stroke="#58a6ff" stroke-width="6" opacity="0.25"/>
    <circle r="130" fill="none" stroke="#58a6ff" stroke-width="6" opacity="0.4"/>
    <circle r="80"  fill="none" stroke="#58a6ff" stroke-width="6" opacity="0.6"/>

    <!-- Sweep arc -->
    <path d="M 0 0 L 200 0 A 200 200 0 0 1 100 173 Z" fill="#58a6ff" opacity="0.15"/>

    <!-- Center node (server / "me") -->
    <circle r="22" fill="url(#pulse)"/>
    <circle r="10" fill="#ffffff"/>

    <!-- Detected device nodes -->
    <circle cx="155" cy="-70"  r="14" fill="#3fb950"/>
    <circle cx="-110" cy="105" r="14" fill="#3fb950"/>
    <circle cx="-160" cy="-55" r="14" fill="#3fb950"/>
    <circle cx="60"  cy="170"  r="14" fill="#3fb950"/>
    <circle cx="170" cy="80"   r="10" fill="#d29922"/>

    <!-- Connecting lines, subtle -->
    <g stroke="#58a6ff" stroke-width="2" opacity="0.35" stroke-linecap="round">
      <line x1="0" y1="0" x2="155" y2="-70"/>
      <line x1="0" y1="0" x2="-110" y2="105"/>
      <line x1="0" y1="0" x2="-160" y2="-55"/>
      <line x1="0" y1="0" x2="60" y2="170"/>
      <line x1="0" y1="0" x2="170" y2="80"/>
    </g>
  </g>
</svg>

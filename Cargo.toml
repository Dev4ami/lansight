[package]
name = "lansight"
version = "0.1.0"
edition = "2021"
description = "Friendly LAN scanner & dashboard for home networks"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
local-ip-address = "0.6"
surge-ping = "0.8"
socket2 = "0.6"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
num-bigint-dig = "0.8"

[profile.release]
opt-level = 3
lto = "thin"

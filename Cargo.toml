[package]
name = "lansight"
version = "0.1.0"
edition = "2021"
description = "Friendly LAN scanner & dashboard for home networks"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
local-ip-address = "0.6"
surge-ping = "0.8"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"

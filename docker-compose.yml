services:
  lansight:
    build: .
    container_name: lansight
    network_mode: host
    restart: unless-stopped
    # ICMP ping (latency + TTL-based OS guess) needs a raw socket.
    # Without this the app still runs — it just falls back to TCP-only probing.
    cap_add:
      - NET_RAW
    environment:
      - PORT=${PORT:-28080}
      - DATA_DIR=/data
      # Require a login password before the dashboard is shown. Unset = no auth.
      # Set the actual value as LANSIGHT_PASSWORD in the Coolify env (keeps it out of git).
      - LANSIGHT_PASSWORD=${LANSIGHT_PASSWORD}
      # Add the `Secure` cookie flag ONLY when serving via HTTPS/tunnel.
      # Leave OFF for plain http host-net access, or the browser drops the cookie -> login loop.
      # - LANSIGHT_COOKIE_SECURE=1
    volumes:
      - ./data:/data
    labels:
      # Tell Coolify not to attach Traefik proxy — we use host network directly.
      - "coolify.managed=true"
      - "coolify.proxy.disabled=true"
    # No `ports:` mapping needed — host network mode binds directly to host.
